# Local full stack: docker compose -f infrastructure/docker/docker-compose.yml up --build
# Development configuration only (outbox mail, generated keys). Not for production.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tracevault
      POSTGRES_PASSWORD: tracevault
      POSTGRES_DB: tracevault
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tracevault']
      interval: 5s
      retries: 10
  api:
    build: { context: ../.., dockerfile: infrastructure/docker/api.Dockerfile }
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://tracevault:tracevault@db:5432/tracevault
      PUBLIC_API_URL: http://localhost:4000
      WEB_ORIGIN: http://localhost:3000
      MAIL_PROVIDER: outbox
    ports: ['4000:4000']
    depends_on: { db: { condition: service_healthy } }
    volumes: [apivar:/srv/var]
  web:
    build: { context: ../.., dockerfile: infrastructure/docker/web.Dockerfile, args: { API_URL: http://api:4000 } }
    ports: ['3000:3000']
    depends_on: [api]
volumes:
  pgdata:
  apivar:
